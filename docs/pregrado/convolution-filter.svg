<text x="24" y="187">Blanco = 1 · oscuro = 0</text>
<text x="226" y="187">Los píxeles seleccionados</text>
<text x="396" y="187">Los mismos en cada ventana</text></g>
<rect x="24" y="207" width="552" height="59" rx="10" fill="#FFFFFF" stroke="#C17626" stroke-width="2" />
<text x="40" y="231" font-size="15" font-weight="700">Multiplicar por posición y sumar</text>
<text x="40" y="253" font-size="15">(0·0 + 1·1 + 0·0) × 3 filas + 0 de sesgo = 3</text>
<text x="24" y="298" font-size="15" font-weight="700">4. Guardar el resultado</text>
<text x="24" y="324" font-size="13">Mover la ventana y repetir la cuenta.</text>
<text x="24" y="348" font-size="13">Cada respuesta forma el mapa.</text>
<text x="24" y="389" font-size="12" fill="#454F61">Paso 1 · sin padding · sin activación</text>
