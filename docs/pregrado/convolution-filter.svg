<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">Cómo un filtro convierte píxeles en una respuesta</title>
<desc id="desc">Una imagen binaria de siete columnas y cinco filas contiene un trazo vertical.
La ventana seleccionada y el filtro tienen filas cero, uno, cero. Se multiplican por posición
los nueve pares de valores y se suman: tres. Ese valor ocupa la primera columna y segunda fila
del mapa de salida. Con paso uno, sin padding y sesgo cero, el mapa tiene tres filas y cinco columnas.</desc>
